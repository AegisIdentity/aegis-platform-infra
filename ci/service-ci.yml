# Aegis per-service CI pipeline. Copy into each service repo as .github/workflows/ci.yml.
# Gates merge on: compile, unit+integration tests (Testcontainers), coverage, SAST, dependency CVEs,
# and container image scan. The shared aegis-platform-parent/commons artifacts are resolved from the
# org Maven registry (GitHub Packages) — see settings note below.
#
# Supply-chain hardening: every action is pinned to a full commit SHA (mutable tags like @master or
# @v4 can be repointed at attacker code — see the 2025 tj-actions/changed-files incident). The trailing
# `# vX.Y.Z` comment records the human-readable version each SHA corresponds to; bump the SHA + comment
# together via Dependabot/Renovate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest # GitHub-hosted runners provide a Docker daemon for Testcontainers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test (unit + Testcontainers), coverage gate
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.showDateTime=true
        run: ./mvnw -B verify

      - name: SAST (SpotBugs)
        run: ./mvnw -B spotbugs:check || (echo "::warning::SpotBugs findings" && exit 1)

      - name: Dependency CVE scan (OWASP Dependency-Check, fails on CVSS >= 7)
        run: ./mvnw -B org.owasp:dependency-check-maven:check
        continue-on-error: false

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco
          path: "**/target/site/jacoco/**"

  image:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # for cosign keyless (OIDC) signing — see the sign step below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package fat jar
        run: ./mvnw -B -DskipTests package

      - name: Build image
        run: docker build -t "ghcr.io/${{ github.repository }}:${{ github.sha }}" .

      - name: Scan image (Trivy, fail on HIGH/CRITICAL)
        # Pinned to a release SHA (was @master — a mutable branch running in a job with
        # packages:write + id-token:write, i.e. push-to-GHCR and OIDC-mint privileges).
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push + sign (cosign keyless)
        # Keyless signing uses the job's OIDC identity (id-token: write) — no long-lived keys.
        # Cluster-side, enforce that only signed images run: a Kyverno / sigstore policy-controller
        # ClusterPolicy verifying the cosign signature + this workflow's OIDC issuer/identity, so an
        # unsigned or foreign-signed image is rejected at admission. Without that enforcement this
        # signature is advisory only.
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          cosign sign --yes "ghcr.io/${{ github.repository }}:${{ github.sha }}"
