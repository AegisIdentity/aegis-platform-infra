apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis-service.name" . }}
  labels:
    {{- include "aegis-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aegis-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.containerPort }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegis-service.name" . }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aegis-service.name" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aegis-service.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis-service.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegis-service.selectorLabels" . | nindent 6 }}
  # M-infra-3: default-deny BOTH directions. Egress is now enforced (was Ingress-only,
  # which let a compromised pod holding token-signing material exfiltrate anywhere).
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.containerPort }}
    {{- else }}
    []  # default-deny: no ingress until an explicit source is configured
    {{- end }}
  egress:
    # Cluster DNS is always required for service discovery; everything else is denied
    # unless explicitly allowlisted in networkPolicy.egressTo (data stores, sibling
    # services). Empty egressTo = DNS-only (most restrictive).
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
