# Aegis local stack. Build the service jars first (scripts/build-all.sh), then `docker compose up`.
#
# OIDC issuer note: the issuer is set to the in-network hostname (http://authorization-server:9000)
# so resource servers validate tokens against a URL that resolves the same inside the compose network
# as the AS advertises. This is the standard docker-compose OIDC pattern — see README.

name: aegis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: aegis
    # M-infra-6: bind to loopback only — the data store must not be reachable from the LAN.
    # Services reach it over the compose network by hostname; developers use localhost.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # M-infra-6: enforce AUTH (requirepass) for consistency with the deployed TLS+AUTH
    # cache, and bind to loopback only. REDISCLI_AUTH lets the healthcheck authenticate
    # without putting the password on the command line.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "dev-only-change-me"]
    environment:
      REDISCLI_AUTH: dev-only-change-me
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka (KRaft). Part of the platform's event backbone; the current core services
  # do not yet publish to it, so nothing depends on it — it is here for the next iteration.
  kafka:
    image: apache/kafka:3.9.0
    # M-infra-6: bind to loopback only (PLAINTEXT broker — must not be LAN-reachable).
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  authorization-server:
    build: ../../aegis-authorization-server
    image: aegis/authorization-server:0.1.0
    environment:
      # Dev profile activates seeded clients/admin, ddl-auto=update, dev secret fallbacks, and
      # relaxed (non-Secure) cookies. Without it the service fail-fasts on required secrets and
      # ddl-auto=validate against an empty schema — the intended prod-safe posture.
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_authz
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_ISSUER: http://authorization-server:9000
      # Public issuer base: tenant-app tokens carry iss = http://localhost:8080/<tenant> — the
      # per-tenant issuer THROUGH THE GATEWAY, resolvable by tenants' own apps and backends.
      AEGIS_PUBLIC_ISSUER_BASE: http://localhost:8080
      # Login delegates credential verification to identity-service.
      IDENTITY_SERVICE_URL: http://identity-service:9102
      # Federated login resolves per-tenant provider config from the social-broker.
      SOCIAL_BROKER_URL: http://social-broker-service:9105
      # Step-up MFA at login is driven against the mfa-webauthn-service.
      MFA_SERVICE_URL: http://mfa-webauthn-service:9103
      # Secret for the aegis-scim client_credentials client (must match the SCIM service).
      # L-infra-3: don't rely on the hardcoded dev fallback — generate a per-checkout secret
      # and put it in compose/.env (auto-loaded, git-ignored), e.g.:
      #   echo "AEGIS_SCIM_CLIENT_SECRET=$(openssl rand -hex 32)" >> compose/.env
      # Both the AS and the SCIM service read the same variable, so they stay in sync.
      AEGIS_SCIM_CLIENT_SECRET: ${AEGIS_SCIM_CLIENT_SECRET:-scim-dev-only-change-me}
      # Secret for the aegis-gateway client_credentials client (scope: tenant:resolve only).
      # Must match the edge-gateway's value below.
      AEGIS_GATEWAY_CLIENT_SECRET: ${AEGIS_GATEWAY_CLIENT_SECRET:-gateway-dev-only-change-me}
      # The AS is the one stateful service: interactive login sessions and short-lived interaction
      # codes. Both go to Redis so any replica can serve any request — without this the service
      # cannot be scaled past one instance (see aegis-authorization-server CLAUDE.md).
      SPRING_DATA_REDIS_HOST: redis
      # The compose Redis enforces AUTH (M-infra-6), so the client must present the password.
      SPRING_DATA_REDIS_PASSWORD: dev-only-change-me
      # (Boot 4 has no spring.session.store-type; the store is enabled in code by RedisSessionConfig.)
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity-service:
    build: ../../aegis-identity-service
    image: aegis/identity-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_identity
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_ISSUER: http://authorization-server:9000
      # Fetch JWKS in-network; accept both the browser-facing and in-network issuers (split-horizon).
      AEGIS_JWKS_URI: http://authorization-server:9000/internal/jwks
      AEGIS_ACCEPTED_ISSUERS: http://localhost:9000,http://authorization-server:9000,http://localhost:8080,http://edge-gateway:8080
      AEGIS_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  tenant-service:
    build: ../../aegis-tenant-service
    image: aegis/tenant-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_tenant
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_ISSUER: http://authorization-server:9000
      # Split-horizon: accept both browser-facing and in-network issuers (see ResourceServerJwtConfig).
      AEGIS_JWKS_URI: http://authorization-server:9000/internal/jwks
      AEGIS_ACCEPTED_ISSUERS: http://localhost:9000,http://authorization-server:9000,http://localhost:8080,http://edge-gateway:8080
      AEGIS_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      # Local dev: skip the real DNS TXT check so custom domains can be verified without owning DNS.
      AEGIS_DOMAINS_AUTO_VERIFY: "true"
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  social-broker-service:
    build: ../../aegis-social-broker-service
    image: aegis/social-broker-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_social
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      # Fetch JWKS in-network; accept both browser-facing and in-network issuers (split-horizon).
      AEGIS_JWKS_URI: http://authorization-server:9000/internal/jwks
      AEGIS_ACCEPTED_ISSUERS: http://localhost:9000,http://authorization-server:9000,http://localhost:8080,http://edge-gateway:8080
    ports:
      - "9105:9105"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  mfa-webauthn-service:
    build: ../../aegis-mfa-webauthn-service
    image: aegis/mfa-webauthn-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_mfa
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      # Fetch JWKS in-network; accept both browser-facing and in-network issuers (split-horizon).
      AEGIS_JWKS_URI: http://authorization-server:9000/internal/jwks
      AEGIS_ACCEPTED_ISSUERS: http://localhost:9000,http://authorization-server:9000,http://localhost:8080,http://edge-gateway:8080
      # The passkey ceremony runs in the browser at the console origin; rp-id must be a registrable
      # suffix of that origin. Locally the console is http://localhost:3000, so rp-id=localhost.
      AEGIS_WEBAUTHN_RP_ID: localhost
      AEGIS_WEBAUTHN_RP_NAME: Aegis
      # Both the console (self-service registration) and the hosted login page (passkey sign-in) origins.
      AEGIS_WEBAUTHN_ORIGINS: http://localhost:3000,http://localhost:9000,http://localhost:8080
    ports:
      - "9103:9103"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  admin-api-service:
    build: ../../aegis-admin-api-service
    image: aegis/admin-api-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # admin-api is the audit SINK: it consumes the stream into the append-only System Log store.
      AEGIS_AUDIT_CONSUMER_ENABLED: "true"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_admin
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_JWKS_URI: http://authorization-server:9000/internal/jwks
      AEGIS_ACCEPTED_ISSUERS: http://localhost:9000,http://authorization-server:9000,http://localhost:8080,http://edge-gateway:8080
    ports:
      - "9107:9107"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  scim-provisioning-service:
    build: ../../aegis-scim-provisioning-service
    image: aegis/scim-provisioning-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Audit event stream (CloudTrail-style): every service publishes security events to Kafka.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_scim
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_JWKS_URI: http://authorization-server:9000/internal/jwks
      AEGIS_ACCEPTED_ISSUERS: http://localhost:9000,http://authorization-server:9000,http://localhost:8080,http://edge-gateway:8080
      # SCIM provisions users into identity-service using a client_credentials token from the AS.
      AEGIS_AS_TOKEN_URI: http://authorization-server:9000/oauth2/token
      AEGIS_SCIM_CLIENT_SECRET: ${AEGIS_SCIM_CLIENT_SECRET:-scim-dev-only-change-me}
      IDENTITY_SERVICE_URL: http://identity-service:9102
      AEGIS_IDENTITY_SERVICE_BASE_URL: http://identity-service:9102
    ports:
      - "9106:9106"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  edge-gateway:
    build: ../../aegis-edge-gateway
    image: aegis/edge-gateway:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AUTHZ_URI: http://authorization-server:9000
      IDENTITY_URI: http://identity-service:9102
      TENANT_URI: http://tenant-service:9101
      SOCIAL_URI: http://social-broker-service:9105
      MFA_URI: http://mfa-webauthn-service:9103
      ADMIN_API_URI: http://admin-api-service:9107
      SCIM_URI: http://scim-provisioning-service:9106
      # Host -> tenant resolution via tenant-service, so white-label custom sign-in domains
      # (login.acme.com) resolve. Without it the tenant is guessed from the first DNS label.
      AEGIS_TENANT_RESOLUTION_ENABLED: "true"
      AEGIS_GATEWAY_CLIENT_SECRET: ${AEGIS_GATEWAY_CLIENT_SECRET:-gateway-dev-only-change-me}
      # M-edge-4: without this the allowlist is EMPTY and a forged Host drives tenant/issuer
      # resolution — a request with Host: evil.example makes the AS advertise
      # issuer=http://evil.example/<tenant>. Pin the hosts the local stack actually uses so the
      # shipped stack is not vulnerable by default; prod sets its real gateway + tenant domains.
      AEGIS_ALLOWED_HOSTS: ${AEGIS_ALLOWED_HOSTS:-localhost,127.0.0.1,edge-gateway}
    ports:
      - "8080:8080"
    depends_on:
      authorization-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      social-broker-service:
        condition: service_healthy
      mfa-webauthn-service:
        condition: service_started
      admin-api-service:
        condition: service_started
      scim-provisioning-service:
        condition: service_started

  # Okta-style front-end (admin console + end-user portal + branded sign-in). Static SPA served by
  # nginx. Browser reaches the OIDC issuer at http://authorization-server:9000, so add
  #   127.0.0.1 authorization-server
  # to your /etc/hosts (the issuer must be identical for the browser and the in-cluster services).
  admin-console:
    build:
      context: ../../aegis-admin-console
      args:
        # Login is served on localhost (same hostname as the console) so passkeys (rpId=localhost,
        # port-independent) registered in the console also work on the hosted login page.
        # The console image build rejects http:// origins unless ALLOW_INSECURE_HTTP=true (L-console-1);
        # local dev uses http on localhost, so opt into the escape hatch here only.
        ALLOW_INSECURE_HTTP: "true"
        VITE_OIDC_AUTHORITY: http://localhost:9000
        VITE_OIDC_CLIENT_ID: aegis-dev-spa
        VITE_API_BASE: http://localhost:8080
    image: aegis/admin-console:0.1.0
    ports:
      # Unprivileged nginx listens on 8080 inside the container (not 80) — see nginx.conf / Dockerfile.
      - "3000:8080"
    depends_on:
      edge-gateway:
        condition: service_started

volumes:
  pgdata:
