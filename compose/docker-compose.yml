# Aegis local stack. Build the service jars first (scripts/build-all.sh), then `docker compose up`.
#
# OIDC issuer note: the issuer is set to the in-network hostname (http://authorization-server:9000)
# so resource servers validate tokens against a URL that resolves the same inside the compose network
# as the AS advertises. This is the standard docker-compose OIDC pattern — see README.

name: aegis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka (KRaft). Part of the platform's event backbone; the current core services
  # do not yet publish to it, so nothing depends on it — it is here for the next iteration.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  authorization-server:
    build: ../../aegis-authorization-server
    image: aegis/authorization-server:0.1.0
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_authz
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_ISSUER: http://authorization-server:9000
      # Login delegates credential verification to identity-service.
      IDENTITY_SERVICE_URL: http://identity-service:9102
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

  identity-service:
    build: ../../aegis-identity-service
    image: aegis/identity-service:0.1.0
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_identity
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_ISSUER: http://authorization-server:9000
      AEGIS_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  tenant-service:
    build: ../../aegis-tenant-service
    image: aegis/tenant-service:0.1.0
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/aegis_tenant
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: dev-only-change-me
      AEGIS_ISSUER: http://authorization-server:9000
      AEGIS_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_healthy

  edge-gateway:
    build: ../../aegis-edge-gateway
    image: aegis/edge-gateway:0.1.0
    environment:
      AUTHZ_URI: http://authorization-server:9000
      IDENTITY_URI: http://identity-service:9102
      TENANT_URI: http://tenant-service:9101
    ports:
      - "8080:8080"
    depends_on:
      authorization-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy

  # Okta-style front-end (admin console + end-user portal + branded sign-in). Static SPA served by
  # nginx. Browser reaches the OIDC issuer at http://authorization-server:9000, so add
  #   127.0.0.1 authorization-server
  # to your /etc/hosts (the issuer must be identical for the browser and the in-cluster services).
  admin-console:
    build:
      context: ../../aegis-admin-console
      args:
        VITE_OIDC_AUTHORITY: http://authorization-server:9000
        VITE_OIDC_CLIENT_ID: aegis-dev-spa
        VITE_API_BASE: http://localhost:8080
    image: aegis/admin-console:0.1.0
    ports:
      - "3000:80"
    depends_on:
      edge-gateway:
        condition: service_started

volumes:
  pgdata:
